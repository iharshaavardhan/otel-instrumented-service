apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-service
  labels:
    app.kubernetes.io/name: otel-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-service
      annotations:
        # Consumed by the Prometheus scrape config in k8s-sre-platform.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-service
          image: ghcr.io/iharshaavardhan/otel-instrumented-service:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OTEL_EXPORTER
              value: "otlp"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc:4318"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: otel-service
  labels:
    app.kubernetes.io/name: otel-service
spec:
  selector:
    app.kubernetes.io/name: otel-service
  ports:
    - name: http
      port: 80
      targetPort: http
